name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    name: CLA Check
    runs-on: ubuntu-latest
    # Skip if the PR is from a Qwentrix org member (bot or staff)
    if: >
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true

    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token with repo scope for the cla-assistant bot account
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_PAT }}
        with:
          # Path inside the repo where signed CLA records are stored
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://cla-assistant.io/Qwentrix/sigil-py"
          branch: "main"
          allowlist: "bot*,github-actions[bot],dependabot[bot]"
          lock-pullrequest-aftermerge: false
          remote-organization-name: Qwentrix
          remote-repository-name: sigil-py
