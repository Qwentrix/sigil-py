[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigil-py"
version = "0.1.0"
description = "Micelium Sigil — Python SDK for embedding governance into AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Qwentrix Inc.", email = "engineering@qwentrix.com" },
]
keywords = ["ai", "governance", "agents", "micelium", "sigil", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "PyNaCl>=1.5.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
    "black>=24.0.0",
]

[project.urls]
Homepage = "https://sigil.micelium.com"
Documentation = "https://sigil.micelium.com/docs"
Repository = "https://github.com/Qwentrix/sigil-py"
"Bug Tracker" = "https://github.com/Qwentrix/sigil-py/issues"

# ---------------------------------------------------------------------------
# Hatchling
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["sigil"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101",  # missing type annotation for 'self' in method
    "ANN102",  # missing type annotation for 'cls' in classmethod
]

[tool.ruff.lint.isort]
known-first-party = ["sigil"]

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sigil --cov-report=term-missing --cov-fail-under=80 -v"
